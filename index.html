<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║                    PARADISE PARK WEBSITE                     ║
  ║                        index.html                            ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  This is the MAIN FILE of the website. It controls what      ║
  ║  appears on the page and in what order.                      ║
  ║                                                              ║
  ║  The actual colors, fonts, and sizing are controlled in:     ║
  ║    → css/style.css                                           ║
  ║                                                              ║
  ║  The interactive behavior (tab switching, hamburger menu)    ║
  ║  is controlled in:                                           ║
  ║    → js/main.js                                              ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="en">
<head>
  <!--
    ┌─────────────────────────────────────────────────────────────┐
    │ HEAD SECTION                                                │
    │ This section is NOT visible on the page. It loads fonts,   │
    │ stylesheets, and tells the browser basic information about  │
    │ the site.                                                   │
    └─────────────────────────────────────────────────────────────┘
  -->

  <!-- Sets the text encoding — always leave this as-is -->
  <meta charset="UTF-8" />

  <!-- Makes the site look correct on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- The text that appears on the browser tab -->
  <title>Paradise Park</title>

  <!-- Loads the stylesheet (colors, fonts, layout) -->
  <link rel="stylesheet" href="css/style.css" />

  <!--
    Loads the two fonts used on this site from Google Fonts
    (requires an internet connection to display correctly):
      • Playfair Display — used for the big "Paradise Park" title
      • Lato             — used for all other text
    To change fonts, visit fonts.google.com, pick a font, and
    replace the link below with the one Google provides.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
</head>

<body>
<!--
  ┌─────────────────────────────────────────────────────────────┐
  │ BODY SECTION                                                │
  │ Everything inside <body> ... </body> is visible on the      │
  │ page. The sections below appear in top-to-bottom order.     │
  └─────────────────────────────────────────────────────────────┘
-->


<!-- ============================================================
     SECTION 1: HEADER
     ─────────────────
     This is the large banner at the top of the page.
     It shows the background image and the "Paradise Park" title.

     HOW TO CHANGE THE BACKGROUND IMAGE:
       Open css/style.css and look for the line:
         --header-bg: url('...');
       Replace the URL with your own image path, for example:
         --header-bg: url('../images/my-photo.jpg');
       Then put your image file in the "images" folder.
============================================================ -->
<header class="site-header">

  <!-- This dark overlay sits on top of the image so the
       white title text is always easy to read.
       Adjust its darkness in css/style.css → .header-overlay -->
  <div class="header-overlay"></div>

  <!-- The main title text displayed over the header image.
       To change the text, edit "Paradise Park" below. -->
  <h1 class="site-title">Paradise Park</h1>

</header>
<!-- END: HEADER -->


<!-- ============================================================
     SECTION 2: NAVIGATION BAR
     ──────────────────────────
     This is the dark bar below the header containing the page tabs.
     It sticks to the top of the screen when you scroll down.

     HOW TO ADD A NEW TAB:
       Copy one of the <button> lines below and paste it after
       the last button. Change the label text AND the data-page
       value to a short one-word name (no spaces), like:
         <button class="nav-tab" data-page="gallery">Gallery</button>
       Then scroll down and add a matching page section.
       (See "HOW TO ADD A NEW PAGE" further down in this file.)
============================================================ -->
<nav class="site-nav">
  <div class="nav-inner">

    <!-- TAB: Home — links to the section with id="page-home" -->
    <button class="nav-tab active" data-page="home">Home</button>

    <!-- TAB: Events — links to the section with id="page-events" -->
    <button class="nav-tab" data-page="events">Events</button>

    <!--
      ↑ ADD NEW TABS ABOVE THIS LINE
      Example:
      <button class="nav-tab" data-page="gallery">Gallery</button>
    -->

  </div>
</nav>
<!-- END: NAVIGATION BAR -->


<!-- ============================================================
     SECTION 3: HOME PAGE
     ─────────────────────
     This is the content area shown when the "Home" tab is active.
     It starts visible by default (class="page active").

     The hamburger menu button lives inside this page, in the
     top-left corner.
============================================================ -->
<main id="page-home" class="page active">


  <!-- ----------------------------------------------------------
       HAMBURGER MENU
       ──────────────
       The three-line (☰) button in the top-left of the home page.
       Clicking it opens a dropdown panel with navigation links.

       HOW THESE LINKS WORK:
         Each link uses data-page="..." to open a hidden page.
         Hidden pages exist in the code but have NO tab in the
         nav bar — they are only reachable through this menu.
         The label between > and </button> is what visitors see.

       HOW TO ADD A NEW LINK:
         1. Copy one full LINK START → LINK END block below
            and paste it after the last link.
         2. Change data-page="..." to a short name (no spaces)
            matching your hidden page's id (e.g. "hours").
         3. Change the label text to what visitors should see.
         4. Scroll down to the HIDDEN PAGES section and add a
            matching hidden page block there.

       HOW TO REMOVE A LINK:
         Delete from ─── LINK START ─── to ─── LINK END ───.

       HOW TO REORDER LINKS:
         Cut and paste full link blocks up or down.
  ---------------------------------------------------------- -->
  <div class="hamburger-wrap">

    <!-- The clickable ☰ button — do not change the id="hamburgerBtn" -->
    <button class="hamburger-btn" id="hamburgerBtn"
            aria-label="Open menu" aria-expanded="false">
      <span></span> <!-- top line    -->
      <span></span> <!-- middle line -->
      <span></span> <!-- bottom line -->
    </button>

    <!-- The dropdown panel that opens when ☰ is clicked.
         Do not change id="hamburgerMenu". -->
    <div class="hamburger-menu" id="hamburgerMenu">

      <!-- ↓ ADD / COPY / REMOVE LINK BLOCKS BELOW THIS LINE ↓ -->

      <!-- ─── LINK START ──────────────────────────────────────────
           LABEL:     what the visitor sees in the menu → "Hours & Pricing"
           data-page: must match a hidden page id below → "hours"
           TO DUPLICATE: copy from LINK START to LINK END and paste below
      ─────────────────────────────────────────────────────────── -->
      <button class="menu-link" data-page="hours">Hours &amp; Pricing</button>
      <!-- ─── LINK END ────────────────────────────────────────── -->

      <!-- ─── LINK START ──────────────────────────────────────────
           LABEL:     what the visitor sees in the menu → "Contact Us"
           data-page: must match a hidden page id below → "contact"
           TO DUPLICATE: copy from LINK START to LINK END and paste below
      ─────────────────────────────────────────────────────────── -->
      <button class="menu-link" data-page="contact">Contact Us</button>
      <!-- ─── LINK END ────────────────────────────────────────── -->

      <!-- ─── LINK START ──────────────────────────────────────────
           LABEL:     what the visitor sees in the menu → "Contact Us"
           data-page: must match a hidden page id below → "contact"
           TO DUPLICATE: copy from LINK START to LINK END and paste below
      ─────────────────────────────────────────────────────────── -->
      <button class="menu-link" data-page="menu">Menu</button>
      <!-- ─── LINK END ────────────────────────────────────────── -->
      <!-- ↑ ADD / COPY / REMOVE LINK BLOCKS ABOVE THIS LINE ↑ -->

    </div>

  </div>
  <!-- END: HAMBURGER MENU -->


  <!-- ----------------------------------------------------------
       HOME PAGE CONTENT
       ─────────────────
       Add the main body content for the Home page here.
       Examples: a welcome message, photos, hours, a map, etc.
  ---------------------------------------------------------- -->
  <div class="page-content">

    <!-- ↓ ADD HOME PAGE CONTENT HERE ↓ -->
<h2>Our mission is to make your visit a beautiful memory</h2>
    <p>Open from 12 - 9 every day</p>
    
    <!-- ↑ ADD HOME PAGE CONTENT HERE ↑ -->

  </div>
  <!-- END: HOME PAGE CONTENT -->


</main>
<!-- END: HOME PAGE -->


<!-- ============================================================
     SECTION 4: EVENTS PAGE
     ───────────────────────
     This content area is shown when the "Events" tab is clicked.
     It starts hidden (class="page" without "active").
     The JavaScript in js/main.js handles showing/hiding pages.
============================================================ -->
<main id="page-events" class="page">

  <!-- ----------------------------------------------------------
       EVENTS PAGE CONTENT
       ────────────────────
       Add content for the Events page here.
       Examples: upcoming events list, calendar, event photos, etc.
  ---------------------------------------------------------- -->
  <div class="page-content">

    <!-- ↓ ADD EVENTS PAGE CONTENT HERE ↓ -->

    <!-- ↑ ADD EVENTS PAGE CONTENT HERE ↑ -->

  </div>
  <!-- END: EVENTS PAGE CONTENT -->

</main>
<!-- END: EVENTS PAGE -->


<!--
  ============================================================
  HOW TO ADD A NEW PAGE (nav bar tab)
  ──────────────────────────────────────────────────────────
  1. Add a tab button in the nav bar above (Section 2):
       <button class="nav-tab" data-page="gallery">Gallery</button>

  2. Copy the block below and paste it above this comment.
     Change "pagename" in BOTH places to match your data-page value.

  <main id="page-pagename" class="page">
    <div class="page-content">
      <!-- ↓ ADD YOUR CONTENT HERE ↓ -->
      <!-- ↑ ADD YOUR CONTENT HERE ↑ -->
    </div>
  </main>

  <!--The JavaScript handles the tab switching automatically.
  ============================================================
-->


<!-- ============================================================
     HIDDEN PAGES
     ─────────────
     These pages are only reachable through the hamburger menu.
     They do NOT appear as tabs in the navigation bar.

     Each hidden page works exactly like a normal page —
     it just has no matching button in the nav bar.

     HOW TO ADD A NEW HIDDEN PAGE:
       1. Add a menu link in the hamburger menu above:
            <button class="menu-link" data-page="hours">Hours &amp; Pricing</button>
       2. Copy one full hidden page block below (from
          "HIDDEN PAGE START" to "HIDDEN PAGE END") and
          paste it before the closing comment below.
       3. Change the id="page-..." in BOTH the comment AND the
          <main> tag to match your new link's data-page value.
       4. Add your content between the content markers.

     HOW TO REMOVE A HIDDEN PAGE:
       Delete from "HIDDEN PAGE START" to "HIDDEN PAGE END"
       and remove its matching link from the hamburger menu.
============================================================ -->

<!-- ═══ HIDDEN PAGE START — id: hours ════════════════════════
     Linked from hamburger menu item: "Hours & Pricing"
     To rename: change data-page in the menu link AND id here.
════════════════════════════════════════════════════════════ -->
<main id="page-hours" class="page hidden-page">
  <div class="page-content">

    <!-- ↓ ADD HOURS & PRICING CONTENT HERE ↓ -->
<h1>Open from 12-9 every day</h1>
    <p>Adults - $10</p>
    <p>Seniors, Military, First Responders - $9</p>
    <p>Children (11 & under) - $8</p>
    <!-- ↑ ADD HOURS & PRICING CONTENT HERE ↑ -->

  </div>
</main>
<!-- ═══ HIDDEN PAGE END — id: hours ═══════════════════════ -->


<!-- ═══ HIDDEN PAGE START — id: contact ══════════════════════
     Linked from hamburger menu item: "Contact Us"
     To rename: change data-page in the menu link AND id here.
════════════════════════════════════════════════════════════ -->
<main id="page-contact" class="page hidden-page">
  <div class="page-content">

    <!-- ↓ ADD CONTACT PAGE CONTENT HERE ↓ -->

    <!-- ↑ ADD CONTACT PAGE CONTENT HERE ↑ -->

  </div>
</main>
<!-- ═══ HIDDEN PAGE END — id: contact ═════════════════════ -->
<!-- ═══ HIDDEN PAGE START — id: menu ════════════════════════
     Linked from hamburger menu item: "Menu"
     To rename: change data-page in the menu link AND id here.
════════════════════════════════════════════════════════════ -->
<main id="page-menu" class="page hidden-page">
  <div class="page-content">

    <!-- ↓ ADD MENU CONTENT HERE ↓ -->

    <!-- ↑ ADD MENU CONTENT HERE ↑ -->

  </div>
</main>
<!-- ═══ HIDDEN PAGE END — id: menu ═══════════════════════ -->
<!--
  ↑ PASTE NEW HIDDEN PAGE BLOCKS ABOVE THIS LINE ↑
  (Copy from "HIDDEN PAGE START" to "HIDDEN PAGE END")
-->


<!-- Loads the JavaScript file — always keep this at the very bottom -->
<script src="js/main.js"></script>

</body>
</html>
